name: Audit film deduplication and expected count
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit_film_metrics.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Inspect stored films and current public film pages
        run: python audit_film_metrics.py
