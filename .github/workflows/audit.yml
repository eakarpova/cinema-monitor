name: Audit Kinopoisk calendar vs database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit.yml'
      - 'audit_premieres.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Compare current and stored dates
        run: python audit_premieres.py
