name: Diagnose Kinobusiness pages
on:
  push:
    branches: [main]
    paths: [".github/workflows/kb_probe.yml","kb_probe.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Inspect public release page structure
        run: python kb_probe.py
