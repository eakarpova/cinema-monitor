name: Validate cinema dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'monitor.py'
      - 'db.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m py_compile app.py monitor.py db.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
