name: Daily premiere check

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinema-monitor-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test parsers and database
        run: python -m unittest discover -s tests -v
      - name: Check Kinopoisk premieres
        id: monitor
        continue-on-error: true
        env:
          MAX_CARD_CHECKS: '50'
          REQUEST_DELAY: '0.6'
        run: python monitor.py
      - name: Save database and diagnostics
        if: always()
        run: |
          git config user.name 'cinema-monitor-bot'
          git config user.email 'cinema-monitor-bot@users.noreply.github.com'
          git add data/cinema.sqlite
          if ! git diff --cached --quiet; then
            git commit -m 'Daily premiere monitoring'
            git push
          fi
      - name: Report source failure
        if: steps.monitor.outcome == 'failure'
        run: |
          echo 'Kinopoisk did not return usable premieres. Diagnostics have been saved.'
          exit 1
