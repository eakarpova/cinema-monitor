name: Daily premiere check
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python monitor.py
      - name: Commit updated database
        run: |
          git config user.name 'cinema-monitor-bot'
          git config user.email 'cinema-monitor-bot@users.noreply.github.com'
          git add data/cinema.sqlite
          git diff --cached --quiet || (git commit -m 'Daily premiere monitoring' && git push)
